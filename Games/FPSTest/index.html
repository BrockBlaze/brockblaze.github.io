<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FPS Game</title>
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="crosshair"><img src="./images/crosshair.png" alt="+" width="20" height="20"></div>
  
  <!-- Preload all textures with explicit dimensions to avoid scaling issues -->
  <div style="display:none;">
    <!-- Wall textures -->
    <img id="wallTexture" src="./images/wall.png" alt="Wall texture">
    <img id="wallTextureFallback" src="./images/wallTexture.jpg" alt="Wall texture fallback">
    <img id="wallTexture2" src="./images/wallTexture1.jpg" alt="Wall texture 2">
    
    <!-- Floor and ceiling textures (using existing textures as placeholders) -->
    <img id="floorTexture" src="./images/wallTexture.jpg" alt="Floor texture">
    <img id="ceilingTexture" src="./images/wall.png" alt="Ceiling texture">
    
    <!-- Gun texture -->
    <img id="gunTexture" src="./images/Pistol.png" alt="Gun texture">

    <!-- Enemy Sprites -->
    <img id="enemyIdle" src="./images/Characters/SoulMan/MainIdle.png" alt="Enemy Idle">
    <img id="enemyWalk1" src="./images/Characters/SoulMan/Walk1.png" alt="Enemy Walk 1">
    <img id="enemyWalk2" src="./images/Characters/SoulMan/Walk2.png" alt="Enemy Walk 2">
    <img id="enemyHurt" src="./images/Characters/SoulMan/Flinch.png" alt="Enemy Hurt">
    <img id="enemyDead" src="./images/Characters/SoulMan/Death1.png" alt="Enemy Dead">
  </div>
  
  <!-- Game loading UI -->
  <div id="loadingScreen">
    <div class="loading-text">Loading Game...</div>
    <div class="progress-bar">
      <div class="progress"></div>
    </div>
  </div>
  
  <script>
    // Ensure texture loading by trying multiple formats
    window.addEventListener('load', function () {
      const wallTexture = document.getElementById('wallTexture');
      const wallTextureFallback = document.getElementById('wallTextureFallback');

      // If the primary texture fails, use the fallback
      if (!wallTexture.complete || wallTexture.naturalWidth === 0) {
        document.getElementById('wallTexture').src = wallTextureFallback.src;
      }
    });
  </script>
  <script type="module" src="js/game.js"></script>
  <!-- <script type="module" src="./js/main.js"></script> -->
</body>
</html>
